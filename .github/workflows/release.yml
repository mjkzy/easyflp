name: Build
permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build binaries
    runs-on: windows-2022

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build easyFLP
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q installer\easyflp.iss

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\easyflp-setup.exe, target\release\easyflp-cli.exe dist\

      - name: Upload easyFLP
        uses: actions/upload-artifact@v4
        with:
          name: easyFLP
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: easyFLP
          path: easyFLP

      - name: Delete old release/tag if exists
        run: |
          gh release delete latest -y || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          cat > notes.md <<'EOF'
          If you do not know what to download, **download `easyflp-setup.exe`**.

          If you are an advanced user or an agent and want to use the command line, look at **`easyflp-cli.exe`**.

          If Windows shows a blue warning, click **More info**, then **Run anyway**.
          EOF
          gh release create latest "easyFLP/easyflp-setup.exe" "easyFLP/easyflp-cli.exe" \
            --title "Latest Build" \
            --notes-file notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
