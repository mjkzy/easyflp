name: Build
permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build binaries
    runs-on: windows-2022

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build easyFLP
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q installer\easyflp.iss

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\easyflp-setup.exe, target\release\easyflp.exe, target\release\easyflp-cli.exe dist\

      - name: Upload easyFLP
        uses: actions/upload-artifact@v4
        with:
          name: easyFLP
          path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: easyFLP
          path: easyFLP

      - name: Delete old release/tag if exists
        run: |
          gh release delete latest -y || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          cat > notes.md <<'EOF'
          This build was automated from ${{ github.sha }}.

          **If you are unsure what to download, download `easyflp-setup.exe`.** Run it to install easyflp. It adds easyflp to the Start Menu, and you do not need admin rights. The installer can also add easyflp to the "Open with" menu for `.flp` and `.fst` files.

          The other files:

          - `easyflp.exe` is the easyflp app itself, the same app that the installer installs. Download it if you want a portable app with no install.
          - `easyflp-cli.exe` is the command line tool, for terminals and scripts. The installer includes it and can add it to PATH.

          `easyflp.exe` was the command line tool in older builds. The command line tool is now `easyflp-cli.exe`, and the old `easyflp-gui.exe` is now `easyflp.exe`.

          The files are not signed, so Windows SmartScreen can show a warning. Click **More info**, then **Run anyway**.
          EOF
          gh release create latest "easyFLP/easyflp-setup.exe" "easyFLP/easyflp.exe" "easyFLP/easyflp-cli.exe" \
            --title "Latest Build" \
            --notes-file notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
